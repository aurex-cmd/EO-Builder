<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Approva account</title>
<style>
  :root{ --fondo:#f3f5f7; --carta:#fff; --ink:#1b2430; --muto:#6b7684; --linea:#e3e8ec; --verde:#13756f; --rosso:#b8493b; }
  @media (prefers-color-scheme: dark){ :root{ --fondo:#0e141b; --carta:#17202a; --ink:#e8edf2; --muto:#93a0ad; --linea:#26323e; --verde:#1f9b92; --rosso:#d0604f; } }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--fondo); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main{ width:100%; max-width:420px; background:var(--carta); border:1px solid var(--linea); border-radius:18px; padding:28px 24px; }
  .marchio{ display:flex; align-items:center; gap:10px; font-weight:700; margin-bottom:22px; }
  .marchio span{ display:grid; place-items:center; width:34px; height:34px; border-radius:10px; background:var(--verde); color:#fff; font-size:13px; }
  h1{ margin:0 0 8px; font-size:24px; letter-spacing:-.02em; }
  p{ margin:0 0 20px; color:var(--muto); }
  b{ color:var(--ink); overflow-wrap:anywhere; }
  button{ width:100%; height:50px; border:0; border-radius:12px; font:inherit; font-weight:600; color:#fff; background:var(--verde); cursor:pointer; }
  button.no{ background:var(--rosso); }
  button:disabled{ opacity:.6; cursor:default; }
</style>
</head>
<body>
<main>
  <div class="marchio"><span>EO</span>EO Pocket</div>
  <div id="box"><h1>Un attimo…</h1><p>Controllo il link.</p></div>
</main>
<script>
// la pagina dei link nelle mail di approvazione: mostra chi è e chiede
// conferma con un pulsante (aprire il link da solo non approva nessuno:
// alcuni programmi di posta aprono i link per controllarli)
const FUNZIONE = 'https://bapfuaxjdjnfvkroznxl.supabase.co/functions/v1/approva-utenti';
const q = new URLSearchParams(location.search);
const base = { azione:q.get('azione') || '', id:q.get('id') || '', t:q.get('t') || '', sig:q.get('sig') || '' };
const box = document.getElementById('box');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const mostra = (titolo, testo) => { box.innerHTML = `<h1>${titolo}</h1><p>${testo}</p>`; };
async function chiama(tipo){
  const r = await fetch(FUNZIONE, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ tipo, ...base }) });
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.errore || 'Errore ' + r.status);
  return d;
}
(async () => {
  try{
    const info = await chiama('info');
    const chi = `<b>${esc(info.email || 'questo account')}</b>`;
    if(!info.esiste) return mostra('Account non più presente', `L'account è già stato cancellato.`);
    if(info.approvato && base.azione === 'approva') return mostra('Già approvato', `${chi} può già usare la sincronizzazione.`);
    const approva = base.azione === 'approva';
    box.innerHTML = `<h1>${approva ? 'Approvare questo account?' : 'Rifiutare questo account?'}</h1>
      <p>${approva ? `${chi} potrà sincronizzare i suoi dati sul cloud.` : `L'account di ${chi} verrà cancellato. Potrà registrarsi di nuovo, e ti arriverà un'altra mail.`}</p>
      <button id="vai"${approva ? '' : ' class="no"'}>${approva ? 'Approva' : 'Rifiuta e cancella'}</button>`;
    document.getElementById('vai').onclick = async e => {
      e.target.disabled = true; e.target.textContent = '…';
      try{
        const r = await chiama('esegui');
        if(r.esito === 'approvato') mostra('Approvato', `${chi} ora può usare la sincronizzazione. Gli basta riaprire l'app.`);
        else if(r.esito === 'rifiutato') mostra('Rifiutato', `L'account di ${chi} è stato cancellato.`);
        else mostra('Fatto', 'Niente da fare: l\'account non esiste più.');
      } catch(err){ mostra('Non riuscito', esc(err.message)); }
    };
  } catch(err){ mostra('Link non valido', esc(err.message)); }
})();
</script>
</body>
</html>
